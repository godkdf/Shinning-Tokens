name: Core checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - run: uv sync --frozen --extra test --python 3.12
      - run: uv run pytest -q
      - run: node --check site/app.js
      - run: node --check site/launcher.js
      - run: node --check site/offline-download.js
      - run: uv run --frozen python -m tokenizer_lab.publication audit --source-only
